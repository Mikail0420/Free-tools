<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bild komprimieren – QuickTools</title>
    <meta name="description" content="Komprimiere Bilder kostenlos direkt im Browser mit QuickTools.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px;
        }

        nav {
            max-width: 900px;
            margin: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
            color: #111827;
        }

        .logo span {
            color: #2563eb;
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 25px;
        }

        .box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .upload {
            border: 2px dashed #cbd5e1;
            border-radius: 14px;
            padding: 40px 20px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        .settings {
            margin: 25px 0;
        }

        .settings label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            max-width: 500px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 12px;
        }

        #preview {
            max-width: 100%;
            max-height: 350px;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
        }

        .download {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 13px 24px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }

        .info {
            margin-top: 15px;
            color: #6b7280;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<header>
    <nav>
        <a href="index.html" class="logo">
            Quick<span>Tools</span>
        </a>
    </nav>
</header>

<main>

    <a href="index.html" class="back">← Zurück zu QuickTools</a>

    <div class="box">

        <h1>Bild komprimieren</h1>

        <p class="description">
            Verkleinere deine Bilddatei kostenlos direkt in deinem Browser.
        </p>

        <div class="upload">
            <strong>Bild auswählen</strong>
            <br>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
        </div>

        <div class="settings">

            <label>
                Qualität:
                <span id="qualityValue">70%</span>
            </label>

            <input
                type="range"
                id="quality"
                min="10"
                max="100"
                value="70"
            >

        </div>

        <button onclick="compressImage()">
            Bild komprimieren
        </button>

        <div id="result">

            <h2>Fertig! 🎉</h2>

            <img id="preview" alt="Komprimiertes Bild">

            <p id="sizeInfo" class="info"></p>

            <a id="download" class="download">
                Bild herunterladen
            </a>

        </div>

    </div>

</main>

<footer>
    © 2026 QuickTools
</footer>

<script>

const qualitySlider = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");

qualitySlider.addEventListener("input", function() {
    qualityValue.textContent = this.value + "%";
});

function compressImage() {

    const fileInput = document.getElementById("fileInput");

    if (!fileInput.files.length) {
        alert("Bitte wähle zuerst ein Bild aus.");
        return;
    }

    const file = fileInput.files[0];
    const quality = Number(qualitySlider.value) / 100;

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img, 0, 0);

            canvas.toBlob(function(blob) {

                const url = URL.createObjectURL(blob);

                document.getElementById("preview").src = url;

                document.getElementById("sizeInfo").textContent =
                    "Original: " +
                    formatBytes(file.size) +
                    " → Komprimiert: " +
                    formatBytes(blob.size);

                const download =
                    document.getElementById("download");

                download.href = url;
                download.download = "quicktools-compressed.jpg";

                document.getElementById("result").style.display = "block";

            }, "image/jpeg", quality);

        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

function formatBytes(bytes) {

    if (bytes === 0) return "0 Bytes";

    const sizes = ["Bytes", "KB", "MB", "GB"];

    const i =
        Math.floor(Math.log(bytes) / Math.log(1024));

    return (
        Math.round(
            bytes / Math.pow(1024, i) * 100
        ) / 100
        + " "
        + sizes[i]
    );
}

</script>

</body>
</html>
