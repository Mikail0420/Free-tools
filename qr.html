<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR-Code Generator – QuickTools</title>

    <meta
        name="description"
        content="Erstelle kostenlos QR-Codes mit QuickTools."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px;
        }

        nav {
            max-width: 900px;
            margin: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
            color: #111827;
        }

        .logo span {
            color: #2563eb;
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 25px;
        }

        .box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            margin-bottom: 20px;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 12px;
        }

        #qrcode {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            max-width: 100%;
        }

        .download {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 13px 24px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }

        .download:hover {
            background: #15803d;
        }

        .info {
            color: #6b7280;
            margin-top: 15px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            main {
                margin: 30px auto;
            }

            .box {
                padding: 25px 18px;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<header>

    <nav>

        <a
            href="index.html"
            class="logo"
        >
            Quick<span>Tools</span>
        </a>

    </nav>

</header>



<main>

    <a
        href="index.html"
        class="back"
    >
        ← Zurück zu QuickTools
    </a>


    <div class="box">

        <h1>
            QR-Code Generator
        </h1>


        <p class="description">

            Erstelle kostenlos einen QR-Code
            für Links, Texte und andere Informationen.

        </p>


        <textarea
            id="text"
            placeholder="Gib hier einen Link oder Text ein..."
        ></textarea>


        <button
            onclick="generateQR()"
        >
            QR-Code erstellen
        </button>


        <div id="result">

            <h2>
                Dein QR-Code 🎉
            </h2>


            <div id="qrcode"></div>


            <p class="info">
                Scanne den QR-Code mit deinem Smartphone
                oder lade ihn als Bild herunter.
            </p>


            <a
                id="download"
                class="download"
                download="quicktools-qrcode.png"
            >
                QR-Code herunterladen
            </a>

        </div>

    </div>

</main>



<footer>

    © 2026 QuickTools

</footer>



<!-- QR-Code Bibliothek -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
></script>



<script>

function generateQR() {

    const text =
        document.getElementById("text").value.trim();


    if (!text) {

        alert(
            "Bitte gib zuerst einen Text oder Link ein."
        );

        return;
    }


    const qrContainer =
        document.getElementById("qrcode");


    /*
     * Alten QR-Code entfernen.
     */

    qrContainer.innerHTML = "";


    /*
     * Neuen QR-Code erstellen.
     */

    new QRCode(qrContainer, {

        text: text,

        width: 256,

        height: 256,

        correctLevel:
            QRCode.CorrectLevel.H

    });


    /*
     * Ergebnis anzeigen.
     */

    document.getElementById("result").style.display =
        "block";


    /*
     * Kurz warten, bis das Bild erstellt wurde,
     * anschließend Download-Link setzen.
     */

    setTimeout(function() {

        const qrImage =
            qrContainer.querySelector("img");


        if (qrImage) {

            document.getElementById("download").href =
                qrImage.src;

        }

    }, 100);

}

</script>


</body>

</html>
