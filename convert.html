<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bild konvertieren – QuickTools</title>

    <meta
        name="description"
        content="Konvertiere JPG, PNG und WebP kostenlos mit QuickTools."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px;
        }

        nav {
            max-width: 900px;
            margin: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
            color: #111827;
        }

        .logo span {
            color: #2563eb;
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 25px;
        }

        .box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .upload {
            border: 2px dashed #cbd5e1;
            border-radius: 14px;
            padding: 40px 20px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            margin: 15px 0;
            max-width: 100%;
        }

        .format-section {
            margin: 25px 0;
        }

        .format-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
            background: white;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 12px;
        }

        #preview {
            max-width: 100%;
            max-height: 350px;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
        }

        .download {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 13px 24px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }

        .download:hover {
            background: #15803d;
        }

        .info {
            margin-top: 15px;
            color: #6b7280;
            line-height: 1.5;
        }

        .privacy {
            margin-top: 25px;
            font-size: 14px;
            color: #6b7280;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            main {
                margin: 30px auto;
            }

            .box {
                padding: 25px 18px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>

    <nav>

        <a href="index.html" class="logo">
            Quick<span>Tools</span>
        </a>

    </nav>

</header>


<main>

    <a href="index.html" class="back">
        ← Zurück zu QuickTools
    </a>


    <div class="box">

        <h1>
            Bild konvertieren
        </h1>

        <p class="description">
            Konvertiere deine Bilder kostenlos zwischen
            JPG, PNG und WebP.
        </p>


        <div class="upload">

            <strong>
                Bild auswählen
            </strong>

            <br>

            <input
                type="file"
                id="fileInput"
                accept="image/jpeg,image/png,image/webp"
            >

        </div>


        <div class="format-section">

            <label for="format">
                Zielformat auswählen:
            </label>

            <select id="format">

                <option value="image/jpeg">
                    JPG
                </option>

                <option value="image/png">
                    PNG
                </option>

                <option value="image/webp">
                    WebP
                </option>

            </select>

        </div>


        <button
            id="convertButton"
            onclick="convertImage()"
        >
            Bild konvertieren
        </button>


        <div id="result">

            <h2>
                Fertig! 🎉
            </h2>


            <img
                id="preview"
                alt="Konvertiertes Bild"
            >


            <p
                id="info"
                class="info"
            ></p>


            <a
                id="download"
                class="download"
            >
                Bild herunterladen
            </a>

        </div>


        <p class="privacy">
            🔒 Deine Bilder werden direkt in deinem Browser verarbeitet
            und nicht auf unseren Server hochgeladen.
        </p>

    </div>

</main>


<footer>

    © 2026 QuickTools

</footer>


<script>

function convertImage() {

    const fileInput =
        document.getElementById("fileInput");

    const button =
        document.getElementById("convertButton");

    const result =
        document.getElementById("result");

    const preview =
        document.getElementById("preview");

    const download =
        document.getElementById("download");

    const info =
        document.getElementById("info");

    const format =
        document.getElementById("format").value;


    /*
     * Prüfen, ob eine Datei ausgewählt wurde.
     */

    if (!fileInput.files.length) {

        alert("Bitte wähle zuerst ein Bild aus.");

        return;
    }


    const file =
        fileInput.files[0];


    /*
     * Button während der Verarbeitung deaktivieren.
     */

    button.disabled = true;

    button.textContent = "Wird konvertiert...";


    const reader =
        new FileReader();


    reader.onload = function(event) {

        const img =
            new Image();


        img.onload = function() {

            const canvas =
                document.createElement("canvas");


            const ctx =
                canvas.getContext("2d");


            canvas.width =
                img.width;

            canvas.height =
                img.height;


            /*
             * JPG unterstützt keine Transparenz.
             * Deshalb bekommt ein transparentes Bild
             * beim Umwandeln zu JPG einen weißen Hintergrund.
             */

            if (format === "image/jpeg") {

                ctx.fillStyle = "#ffffff";

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );
            }


            /*
             * Bild auf das Canvas zeichnen.
             */

            ctx.drawImage(
                img,
                0,
                0
            );


            /*
             * Canvas in das gewünschte Format umwandeln.
             */

            canvas.toBlob(

                function(blob) {

                    if (!blob) {

                        alert(
                            "Die Konvertierung ist fehlgeschlagen."
                        );

                        button.disabled = false;

                        button.textContent =
                            "Bild konvertieren";

                        return;
                    }


                    /*
                     * Temporäre URL für die neue Datei erstellen.
                     */

                    const url =
                        URL.createObjectURL(blob);


                    /*
                     * Vorschau anzeigen.
                     */

                    preview.src =
                        url;


                    /*
                     * Dateiendung bestimmen.
                     */

                    let extension;


                    if (format === "image/jpeg") {

                        extension = "jpg";

                    } else if (format === "image/png") {

                        extension = "png";

                    } else {

                        extension = "webp";
                    }


                    /*
                     * Download vorbereiten.
                     */

                    download.href =
                        url;

                    download.download =
                        "quicktools-converted." +
                        extension;


                    /*
                     * Informationen anzeigen.
                     */

                    info.textContent =
                        "Original: " +
                        formatBytes(file.size) +
                        " → Neue Datei: " +
                        formatBytes(blob.size);


                    /*
                     * Ergebnis anzeigen.
                     */

                    result.style.display =
                        "block";


                    /*
                     * Button zurücksetzen.
                     */

                    button.disabled = false;

                    button.textContent =
                        "Bild konvertieren";

                },

                format,

                /*
                 * JPG/WebP Qualität.
                 * PNG ignoriert diesen Wert.
                 */

                0.9

            );

        };


        img.onerror = function() {

            alert(
                "Dieses Bild konnte nicht verarbeitet werden."
            );

            button.disabled = false;

            button.textContent =
                "Bild konvertieren";
        };


        img.src =
            event.target.result;

    };


    reader.onerror = function() {

        alert(
            "Die Datei konnte nicht gelesen werden."
        );

        button.disabled = false;

        button.textContent =
            "Bild konvertieren";
    };


    reader.readAsDataURL(file);

}


/*
 * Dateigröße lesbar darstellen.
 */

function formatBytes(bytes) {

    if (bytes === 0) {

        return "0 Bytes";
    }


    const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        Math.round(
            bytes /
            Math.pow(1024, i) *
            100
        ) / 100
        +
        " " +
        sizes[i]
    );
}

</script>

</body>
</html>
